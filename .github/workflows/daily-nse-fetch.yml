name: Daily NSE candle fetch

# 18:00 IST = 12:30 UTC (India has no DST).
# GitHub cron is UTC-only and can lag by a few minutes.
on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

concurrency:
  group: daily-nse-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: scripts
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch daily NSE candles into Supabase
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Local time: $(TZ=Asia/Kolkata date)"
          python -u fetch_nse_data.py --timeframe 1d --batch-size 20 --delay 2
