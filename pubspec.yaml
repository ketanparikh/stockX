name: stockx
description: Stock Screener with RSI, Supertrend, Chandelier Exit & more
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.5
  dio: ^5.4.0
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  shimmer: ^3.0.0
  go_router: ^13.2.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.12
  custom_lint: ^0.6.3
  riverpod_lint: ^2.3.12

flutter:
  uses-material-design: true
